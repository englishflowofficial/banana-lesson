name: Deploy to GitHub Pages

# Builds and publishes the app to https://englishflowofficial.github.io/banana-lesson/
# every time main moves, and on demand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages and verify the deployment origin.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; queue instead of cancelling a live rollout.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Type-check, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and unit tests
        run: |
          npx tsc -b
          npm run test

      - name: Build the production bundle
        run: npm run build
        env:
          NODE_ENV: production

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
