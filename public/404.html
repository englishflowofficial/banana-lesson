<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Action English</title>
    <script>
      // GitHub Pages serves this file for unknown sub-paths. The app itself uses
      // hash routing (which Pages always serves from index.html), so this is a
      // safety net that forwards any stray deep link back to the app root.
      (function () {
        var base = '/banana-lesson/'
        var path = window.location.pathname
        var rest = path.indexOf(base) === 0 ? path.slice(base.length) : ''
        window.location.replace(base + '#/' + rest.replace(/^\/+/, '') + window.location.search)
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fffcf5;
        color: #4a3b30;
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <p>Redirecting to <a href="/banana-lesson/">Action English</a>…</p>
  </body>
</html>
